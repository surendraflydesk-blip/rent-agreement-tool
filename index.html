
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agreement Auto Position Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#eef2f7;margin:0;padding:16px;color:#172033}
main{max-width:1000px;margin:auto;background:#fff;padding:20px;border-radius:12px}
label{display:block;font-weight:bold;margin-top:14px}
input,button,select{width:100%;padding:11px;margin-top:7px;border:1px solid #cbd5e1;border-radius:7px}
button{background:#075ee8;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#stage{position:relative;margin-top:14px;border:1px solid #bbb;overflow:auto;background:#ddd}
#page{display:block;max-width:100%;height:auto;margin:auto;background:white}
#overlay{position:absolute;left:0;top:0;display:none;cursor:move;touch-action:none;user-select:none}
#status{white-space:pre-wrap;background:#f5f7fb;padding:12px;margin-top:12px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<main>
<h2>Agreement — Mouse Adjust & Auto Save</h2>

<label>1. Reference Final PDF (optional)</label>
<input id="reference" type="file" accept=".pdf">

<label>2. New Draft PDF</label>
<input id="draft" type="file" accept=".pdf">

<label>3. Company Seal + Signature Image</label>
<input id="seal" type="file" accept="image/png,image/jpeg">

<label>4. New valid stamp image (optional)</label>
<input id="stamp" type="file" accept="image/png,image/jpeg">

<label>Draft page</label>
<div class="tools">
<select id="pageNo"></select>
<select id="asset">
<option value="seal">Seal / Signature</option>
<option value="stamp">New valid stamp</option>
</select>
</div>

<div class="tools">
<div>
<label>Image width (PDF points)</label>
<input id="imgWidth" type="number" min="10" max="500" value="120">
</div>
<div>
<label>Image height (PDF points)</label>
<input id="imgHeight" type="number" min="10" max="500" value="55">
</div>
</div>

<button id="load">Load Draft & Preview</button>
<div id="stage">
<canvas id="page"></canvas>
<img id="overlay" alt="Drag image to position">
</div>
<div class="tools">
<button id="showAsset">Show Selected Image</button>
<button id="savePos">Save Position for This Page</button>
</div>
<button id="download">Download PDF Using Saved Positions</button>
<div id="status">Draft upload karein, phir Load Draft dabayein.</div>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc=
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
let pdfData=null,pdfDoc=null,pages=[],positions={};
let activeImage=null,drag=null,scale=1;

function say(s){$('status').textContent=s}
function key(){return $('pageNo').value+'_'+$('asset').value}

async function readImage(file){
 if(!file)return null;
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>resolve({im,url});
  im.onerror=reject;
  im.src=url;
 });
}

async function loadDraft(){
 try{
  const file=$('draft').files[0];
  if(!file){say('Pehle Draft PDF select karein.');return}
  say('PDF load ho raha hai...');
  pdfData=await file.arrayBuffer();
  pdfDoc=await pdfjsLib.getDocument({data:pdfData.slice(0)}).promise;
  pages=[];
  $('pageNo').innerHTML='';
  for(let i=1;i<=pdfDoc.numPages;i++){
   pages.push(await pdfDoc.getPage(i));
   const o=document.createElement('option');
   o.value=i;o.textContent='Page '+i;$('pageNo').appendChild(o);
  }
  await showPage();
  say('Page load ho gaya. Image select karke Show Selected Image dabayein. Mouse se image ko sahi jagah drag karein, phir Save Position dabayein.');
 }catch(e){say('Load error: '+e.message)}
}

async function showPage(){
 if(!pages.length)return;
 const p=pages[Number($('pageNo').value||1)-1];
 const viewport=p.getViewport({scale:1.5});
 const c=$('page');c.width=viewport.width;c.height=viewport.height;
 const ctx=c.getContext('2d');
 await p.render({canvasContext:ctx,viewport}).promise;
 const rect=c.getBoundingClientRect();
 scale=c.width/rect.width;
 $('overlay').style.display='none';
 const saved=positions[key()];
 if(saved){
  $('overlay').style.display='block';
  $('overlay').src=saved.url;
  placeOverlay(saved.x*c.width,saved.y*c.height,
    saved.w*c.width,saved.h*c.height);
 }
}

function placeOverlay(x,y,w,h){
 const c=$('page'),o=$('overlay');
 o.style.left=(c.offsetLeft+x/scale)+'px';
 o.style.top=(c.offsetTop+y/scale)+'px';
 o.style.width=(w/scale)+'px';
 o.style.height=(h/scale)+'px';
}

$('load').onclick=loadDraft;
$('pageNo').onchange=showPage;
$('asset').onchange=showPage;

$('showAsset').onclick=async()=>{
 const file=$('asset').value==='seal'?
  $('seal').files[0]:$('stamp').files[0];
 if(!file){say('Pehle selected image upload karein.');return}
 try{
  activeImage=await readImage(file);
  const c=$('page'),o=$('overlay');
  o.src=activeImage.url;
  o.style.display='block';
  const w=Number($('imgWidth').value)||120;
  const h=Number($('imgHeight').value)||55;
  const rect=c.getBoundingClientRect();
  placeOverlay(30*scale,30*scale,w*scale,h*scale);
  say('Image dikh rahi hai. Mouse se drag karke sahi jagah rakhein. Size badalne ke liye width/height badalkar Show Selected Image dabayein.');
 }catch(e){say('Image error: '+e.message)}
};

$('overlay').addEventListener('pointerdown',e=>{
 if(!activeImage && !$('overlay').src)return;
 drag={x:e.clientX-parseFloat($('overlay').style.left),
       y:e.clientY-parseFloat($('overlay').style.top)};
 $('overlay').setPointerCapture(e.pointerId);
});
$('overlay').addEventListener('pointermove',e=>{
 if(!drag)return;
 const c=$('page'),o=$('overlay');
 const left=e.clientX-drag.x,top=e.clientY-drag.y;
 o.style.left=left+'px';o.style.top=top+'px';
});
$('overlay').addEventListener('pointerup',()=>drag=null);
$('overlay').addEventListener('pointercancel',()=>drag=null);

$('savePos').onclick=async()=>{
 const file=$('asset').value==='seal'?
  $('seal').files[0]:$('stamp').files[0];
 if(!file||!pages.length){say('Draft aur image load karein.');return}
 if(!$('overlay').src){say('Pehle Show Selected Image dabayein.');return}
 const c=$('page'),o=$('overlay'),cr=c.getBoundingClientRect();
 const left=(parseFloat(o.style.left)-c.offsetLeft)*scale;
 const top=(parseFloat(o.style.top)-c.offsetTop)*scale;
 const w=o.getBoundingClientRect().width*scale;
 const h=o.getBoundingClientRect().height*scale;
 const img=await readImage(file);
 positions[key()]={url:img.url,file,type:$('asset').value,
  x:left/c.width,y:top/c.height,w:w/c.width,h:h/c.height};
 say('Position saved: Page '+$('pageNo').value+' / '+$('asset').value+
 '\nIsi tarah har zaroori page aur image ki position save karein.');
};

$('download').onclick=async()=>{
 try{
  if(!pdfData||!pages.length){say('Pehle Load Draft dabayein.');return}
  const pdf=await PDFLib.PDFDocument.load(pdfData);
  let count=0;
  for(const k of Object.keys(positions)){
   const p=positions[k],page=pdf.getPage(Number(k.split('_')[0])-1);
   const {width,height}=page.getSize();
   const imageBytes=await p.file.arrayBuffer();
   const img=p.file.type==='image/png'?
    await pdf.embedPng(imageBytes):await pdf.embedJpg(imageBytes);
   page.drawImage(img,{
    x:p.x*width,y:height-(p.y+p.h)*height,
    width:p.w*width,height:p.h*height
   });
   count++;
  }
  const out=await pdf.save();
  const url=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));
  const a=document.createElement('a');a.href=url;
  a.download='Agreement_Adjusted.pdf';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  say('PDF download ho gaya.\nSaved image positions: '+count+
  '\nPositions is session mein saved hain; agli baar naya Draft load karke positions dobara set karein.');
 }catch(e){say('Export error: '+e.message)}
};
</script>
</body>
</html>
