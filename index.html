
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agreement Auto Placement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:18px;color:#172033}
main{max-width:850px;margin:auto;background:white;padding:22px;border-radius:14px}
h2{margin-top:0}label{display:block;font-weight:bold;margin-top:16px}
input,button{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border-radius:8px;border:1px solid #cbd5e1}
button{background:#075ee8;color:white;font-weight:bold;cursor:pointer;border:0;margin-top:14px}
#status{white-space:pre-wrap;background:#f8fafc;padding:12px;margin-top:14px}
canvas{width:100%;border:1px solid #ddd;margin-top:14px}
</style>
</head>
<body>
<main>
<h2>Agreement Auto Placement Tool</h2>

<label>Reference Final Agreement PDF</label>
<input id="reference" type="file" accept=".pdf">

<label>New Draft PDF</label>
<input id="draft" type="file" accept=".pdf">

<label>New valid stamp image (PNG/JPG)</label>
<input id="stamp" type="file" accept="image/png,image/jpeg">

<label>Company seal and signature image (PNG/JPG)</label>
<input id="seal" type="file" accept="image/png,image/jpeg">

<button id="scan">SCAN PDF AUTOMATICALLY</button>
<canvas id="preview"></canvas>
<button id="download">DOWNLOAD PROCESSED PDF</button>
<div id="status">Upload both PDFs and press Scan.</div>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc=
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $=id=>document.getElementById(id);
let source=null, found=[];

function status(s){$('status').textContent=s}

async function loadPDF(file){
 const bytes=await file.arrayBuffer();
 const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
 const pages=[];
 for(let i=1;i<=doc.numPages;i++){
  const p=await doc.getPage(i);
  const viewport=p.getViewport({scale:1.5});
  const canvas=document.createElement('canvas');
  canvas.width=viewport.width;canvas.height=viewport.height;
  await p.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
  const content=await p.getTextContent();
  const items=content.items.map(t=>{
   const x=t.transform[4]*1.5;
   const y=viewport.height-t.transform[5]*1.5;
   return {text:t.str.toLowerCase(),x,y,w:t.width*1.5,h:Math.max(10,Math.abs(t.transform[3])*1.5)};
  });
  pages.push({page:i,canvas,width:viewport.width,height:viewport.height,items,
   text:items.map(a=>a.text).join(' ')});
 }
 return {bytes,doc,pages};
}

function anchor(page,words){
 for(const word of words){
  const hit=page.items.find(x=>x.text.includes(word));
  if(hit)return hit;
 }
 return null;
}

function imageFile(file){
 return new Promise((resolve,reject)=>{
  const im=new Image();
  im.onload=()=>resolve(im);
  im.onerror=reject;
  im.src=URL.createObjectURL(file);
 });
}

$('scan').onclick=async()=>{
 try{
  if(!$('reference').files[0]||!$('draft').files[0]){
   status('Select Reference PDF and Draft PDF first.');return;
  }
  status('Scanning pages...');
  const ref=await loadPDF($('reference').files[0]);
  source=await loadPDF($('draft').files[0]);
  found=[];

  // Find the stamp location in the reference by visual image analysis
  // and text matching; do not reuse an old government e-stamp.
  const stampWords=['e-stamp','e stamp','non judicial','stamp duty',
                    'certificate no','certificate number'];
  let refStamp=null;
  for(const p of ref.pages){
   const a=anchor(p,stampWords);
   if(a){refStamp={page:p.page,anchor:a};break;}
  }

  // Detect likely signature locations on draft pages.
  const signWords=['authorized signatory','authorised signatory',
   'signature of client','signature','proprietor','owner signature'];
  for(const p of source.pages){
   const a=anchor(p,signWords);
   if(a)found.push({page:p.page,type:'seal',anchor:a,
    pw:p.width,ph:p.height});
  }

  // Preview first draft page.
  const p=source.pages[0],c=$('preview');
  c.width=p.canvas.width;c.height=p.canvas.height;
  c.getContext('2d').drawImage(p.canvas,0,0);

  status(
   'Reference pages: '+ref.pages.length+
   '\nDraft pages: '+source.pages.length+
   '\nReference stamp text: '+(refStamp?'found on page '+refStamp.page:'not detected')+
   '\nDraft signature text matches: '+found.length+
   '\n\nScan finished. Download creates a PDF using detected text anchors.'
  );
 }catch(e){status('Scan error: '+e.message)}
};

$('download').onclick=async()=>{
 try{
  if(!source){status('Press SCAN PDF AUTOMATICALLY first.');return}
  const pdf=await PDFLib.PDFDocument.load(source.bytes);
  let seal=null,stamp=null;
  async function embed(file){
   if(!file)return null;
   const b=await file.arrayBuffer();
   return file.type==='image/png'?pdf.embedPng(b):pdf.embedJpg(b);
  }
  seal=await embed($('seal').files[0]);
  stamp=await embed($('stamp').files[0]);

  // Only place a new, separately supplied stamp where draft text
  // provides a matching anchor. Never duplicate the reference e-stamp.
  let count=0;
  for(const item of found){
   if(!seal)continue;
   const page=pdf.getPage(item.page-1),size=page.getSize();
   const sx=size.width/item.pw,sy=size.height/item.ph;
   const a=item.anchor;
   const w=105,h=45;
   const x=Math.max(0,Math.min(a.x*sx,size.width-w));
   const y=Math.max(0,Math.min(size.height-(a.y+a.h)*sy-h,size.height-h));
   page.drawImage(seal,{x,y,width:w,height:h,opacity:0.9});
   count++;
  }

  // Stamp is deliberately not placed unless an actual valid stamp
  // location is identified in the new draft.
  const output=await pdf.save();
  const url=URL.createObjectURL(new Blob([output],{type:'application/pdf'}));
  const a=document.createElement('a');
  a.href=url;a.download='Processed_Agreement.pdf';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  status('PDF downloaded.\nCompany seal placements: '+count+
   '\nStamp image selected: '+($('stamp').files[0]?'Yes':'No')+
   '\nReview the PDF before using it.');
 }catch(e){status('PDF error: '+e.message)}
};
</script>
</body>
</html>
